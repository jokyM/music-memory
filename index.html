<script>
const VERSION = "2.6";   // bei jeder Aenderung erhoehen – iPhones laden dann automatisch neu

/* ============================================================
   SPIEL 1 – MUSIK: Songs als "Interpret Titel"
   Jeder Song = 2 Plaketten
   ============================================================ */
const SONGS = [
  "Golden HUNTR/X KPop Demon Hunters",
  "Waka Waka Shakira",
  "Dai Dai Shakira",
  "Better When I'm Dancin' Meghan Trainor",
  "I Don't Wanna Wait David Guetta",
  "24K Magic Bruno Mars",
  "Shake It Off Taylor Swift",
  "Zoo Shakira",
];
const SNIPPET = 30;      // Sekunden (Hoerproben sind max. 30 s lang)
const COUNTRY = "DE";    // Apple-Store-Land fuer die Suche

/* ============================================================
   SPIEL 2 – RECHNEN: [ "Aufgabe", "Ergebnis" ]
   Jedes Paar = 2 Plaketten. Jedes Ergebnis nur EINMAL verwenden!
   ============================================================ */
const PAIRS = [
  ["8 × 8",    "64"],
  ["100 − 50", "50"],
  ["7 × 6",    "42"],
  ["45 + 36",  "81"],
  ["90 : 3",   "30"],
  ["13 + 12",  "25"],
];

/* ============================================================
   SPIEL 3 – BILDER: JPEGs in den Ordner "bilder" hochladen
   "bilder/x.jpg"                           -> zwei gleiche Bilder
   ["bilder/x.jpg", "Name"]                 -> Bild + Name
   { bild: "bilder/x.jpg", song: "Titel" }  -> Bild + Song aus Apple Music
   Song wie bei Musik: "Titel Interpret" oder "Titel Film" (im Setup pruefen!)
   ============================================================ */
const BILDER = [
  { bild: "bilder/elsa.jpg",       song: "Let It Go Idina Menzel" },
  { bild: "bilder/arielle.jpg",    song: "Part of Your World Jodi Benson" },
  { bild: "bilder/belle.jpg",      song: "Beauty and the Beast Angela Lansbury" },
  { bild: "bilder/aladdin.jpg",    song: "A Whole New World Aladdin" },
  { bild: "bilder/rapunzel.jpg",   song: "I See the Light Tangled" },
  { bild: "bilder/vaiana.jpg",     song: "How Far I'll Go Moana" },
];
const SNIPPET_BILDER = 15;   // Sekunden fuer die Songs im Bilder-Spiel

/* Ersatzwerte, falls "einstellungen.json" fehlt oder nicht geladen werden kann.
   Die eigentlichen Einstellungen fuer ALLE Geraete stehen in einstellungen.json. */
const AKTIV = ["musik", "rechnen", "bilder"];

/* Ersatzwert: wie viele Plaketten du besitzt (Obergrenze fuer die Kachel-Auswahl). */
const PLAKETTEN = 24;
</script>

  @keyframes eq { 0%,100% { height: 4px } 50% { height: 14px } }

  /* Rechen-Karte */

  .q.long { font-size: 34px; }

  /* Setup */
  .setup { width: 100%; max-width: 640px; }
  .setup h2 { color: var(--bronze); font-size: 20px; margin: 0 0 6px; }
  .setup p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; font-size: 14px; }

  .games label + label { border-top: 1px solid rgba(120,144,173,.12); }
  .games .gi { width: 30px; text-align: center; color: var(--bronze-hi); font-size: 20px; font-weight: 800; }
  .games .gn { flex: 1; }
  .games .gc { color: var(--muted); font-size: 13px; }
  .sw { position: relative; width: 50px; height: 30px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }

<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3b6cb"/><stop offset=".55" stop-color="#5f7692"/><stop offset="1" stop-color="#34465e"/>
    </linearGradient>
    <pattern id="hx" width="28" height="49" patternUnits="userSpaceOnUse" patternTransform="scale(.7)">
      <path d="M14 33L0 25V8L14 0l14 8v17L14 33zm0 16L0 41V25l14 8 14-8v16L14 49z" fill="none" stroke="#0e131b" stroke-opacity=".28" stroke-width="1.5"/>
    </pattern>
  </defs>
</svg>
<div id="app"></div>

<script>
// ---------- Speicher (pro Handy) ----------
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch {} }

let MODE = load("mode", "musik");                 // "musik" | "rechnen"
let SEED = parseInt(load("seed", "4711"), 10);

const GAMES = {
  musik:   { name: "Musik-Memory",  icon: "♪",   count: () => SONGS.length },
  rechnen: { name: "Rechnen-Memory", icon: "×÷", count: () => PAIRS.length },
  bilder:  { name: "Prinzessinnen-Memory", icon: "♛",  count: () => BILDER.length },
};

// Aktivierte Spiele (pro Handy gespeichert, sonst AKTIV aus der Konfiguration)
// ---------- Gemeinsame Einstellungen (einstellungen.json, gilt fuer alle Geraete) ----------
let SETTINGS = { aktiv: AKTIV, plaketten: PLAKETTEN }, SETTINGS_SRC = "standard";
let ENABLED = [];
function applySettings() {
  ENABLED = (Array.isArray(SETTINGS.aktiv) ? SETTINGS.aktiv : []).filter(k => GAMES[k]);
  if (!ENABLED.length) ENABLED = Object.keys(GAMES);
  if (!ENABLED.includes(MODE)) { MODE = ENABLED[0]; save("mode", MODE); }
}
function loadSettings() {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 4000);
  return fetch("einstellungen.json?nocache=" + Date.now(), { cache: "no-store", signal: ctl.signal })
    .then(r => { if (!r.ok) throw r.status; return r.json(); })
    .then(j => {
      SETTINGS = {
        aktiv: Array.isArray(j.aktiv) ? j.aktiv : AKTIV,
        plaketten: Math.max(4, parseInt(j.plaketten, 10) || PLAKETTEN),
      };
      SETTINGS_SRC = "datei";
    })
    .catch(e => { SETTINGS_SRC = e === 404 ? "fehlt" : "standard"; })
    .finally(() => { clearTimeout(timer); applySettings(); });
}
applySettings();
// GitHub-Adresse des Repositorys (fuer die Links im Setup)
const GH = (() => {
  if (!location.hostname.endsWith(".github.io")) return null;
  const owner = location.hostname.split(".")[0], repo = location.pathname.split("/").filter(Boolean)[0];
  return repo ? `https://github.com/${owner}/${repo}` : null;
})();

// ---------- Mischen ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Plakette t (1..2N) -> [Paar-Index, Seite 0/1]
function pairing(n, seed) {
  const s = [...Array(2 * n).keys()], r = mulberry32(seed);
  for (let i = s.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [s[i], s[j]] = [s[j], s[i]]; }
  return s.map(x => [x >> 1, x & 1]);
}

// ---------- Kachel-Anzahl ----------
const plaques = () => { const v = SETTINGS.plaketten; return v - (v % 2); };
const maxTiles = (mode = MODE) => { const m = Math.min(plaques(), 2 * GAMES[mode].count()); return m - (m % 2); };
// Kacheln: Standard = Maximum (alle Elemente, begrenzt durch die Plaketten); reduzieren im Menue moeglich
function tiles(mode = MODE) {
  const max = maxTiles(mode), v = parseInt(load("tiles2_" + mode, String(max)), 10) || max;
  return Math.max(Math.min(4, max), Math.min(max, v - (v % 2)));
}
// Vorschlaege: Leicht / Mittel / Schwer innerhalb des Maximums
function presets(mode = MODE) {
  const max = maxTiles(mode), ev = x => Math.max(4, Math.round(x / 2) * 2);
  const out = [["Leicht", ev(max / 3)], ["Mittel", ev(max * 2 / 3)], ["Schwer", max]].filter(([, v]) => v <= max);
  return out.filter(([, v], i) => out.findIndex(([, w]) => w === v) === i);
}
// Auslege-Vorschlag: moeglichst quadratisches Raster
function grid(n) {
  let best = [1, n];
  for (let r = 1; r * r <= n; r++) if (n % r === 0) best = [r, n / r];
  if (best[0] === 1 && n > 5) return null;
  return best;
}
// Plakette t (1..Kacheln) -> [Index im Pool, Seite]; waehlt pro Runde zufaellig, welche Paare mitspielen
function gameMap() {
  const k = tiles() / 2, N = GAMES[MODE].count(), r = mulberry32(SEED ^ 0x5bd1e995);
  const pool = [...Array(N).keys()];
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const chosen = pool.slice(0, k);
  return pairing(k, SEED).map(([p, side]) => [chosen[p], side]);
}

function itunes(term) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2), s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject("network"); }, 8000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); d.results && d.results[0] && d.results[0].previewUrl ? resolve(d.results[0]) : reject("notfound"); };
    s.onerror = () => { cleanup(); reject("network"); };
    s.src = `https://itunes.apple.com/search?entity=song&limit=1&country=${COUNTRY}&term=${encodeURIComponent(term)}&callback=${cb}`;
    document.head.appendChild(s);
  });
}

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const BASE = location.origin + location.pathname;
const HEXP = "M140 10 L253 75 L253 205 L140 270 L27 205 L27 75 Z";
const HEX_PAT = `<svg viewBox="0 0 280 280"><path d="${HEXP}" fill="url(#g)"/><path d="${HEXP}" fill="url(#hx)"/></svg>`;
const HEX_PLAIN = `<svg viewBox="0 0 280 280"><path d="${HEXP}" fill="url(#g)"/></svg>`;
const menuLink = `<a class="menu" href="${location.pathname}">‹ Menü</a>`;

// ---------- Menue ----------
function renderMenu(msg = "") {
  const g = GAMES[MODE], T = tiles(), n = T / 2, max = maxTiles(), gr = grid(T);
  const stt = getState(), done = stt ? stt.found.length : 0;
  const running = load("running", "") === String(SEED);
  app.className = "";
  const layout = `Lege die Plaketten <b>1 bis ${T}</b> verdeckt aus${gr ? `,<br>Vorschlag: <b>${gr[0]} Reihen × ${gr[1]}</b>` : ""}`;

  if (running) {                       // ---- laufendes Spiel: nur dieses Spiel, keine Einstellungen
    const finished = done === n;
    app.innerHTML = `
      <h1>${g.name}</h1>
      <div class="choices"><div class="choice solo">${HEX_PAT}<span class="lbl"><span class="ico">${g.icon}</span>${T} Kacheln</span></div></div>
      <div class="progress"><b>${done}</b> von ${n} Paaren gefunden</div>
      <div class="bar"><i style="width:${n ? done / n * 100 : 0}%"></i></div>
      <div class="info">${finished ? "Alle Paare gefunden! 🎉" : `${layout}<br>Halte die Plakette oben ans Handy.`}</div>
      <button class="newgame ${finished ? "" : "ghost"}" id="end">${finished ? "Neues Spiel" : "Spiel beenden"}</button>
      <div class="toast">${msg}</div>`;
    document.getElementById("end").onclick = () => {
      if (!finished && done > 0 && !confirmEnd()) return;
      save("running", ""); renderMenu();
    };
    return;
  }

  app.innerHTML = `
    <h1>Memory</h1>
    <div class="choices">
      ${Object.entries(GAMES).filter(([k]) => ENABLED.includes(k)).map(([k, v]) => `
        <button class="choice ${k === MODE ? "" : "off"}" data-mode="${k}">
          ${HEX_PAT}<span class="lbl"><span class="ico">${v.icon}</span><span class="${v.name.split("-")[0].length > 8 ? "sm" : ""}">${v.name.split("-")[0]}</span></span>
        </button>`).join("")}
    </div>
    <div class="tiles">
      <div class="tl">Anzahl Kacheln</div>
      <div class="stepper">
        <button id="minus" ${T <= 4 ? "disabled" : ""} aria-label="weniger">−</button>
        <span class="tv">${T}</span>
        <button id="plus" ${T >= max ? "disabled" : ""} aria-label="mehr">+</button>
      </div>
      <div class="chips">${presets().map(([l, v]) => `<button class="chip ${v === T ? "on" : ""}" data-tiles="${v}">${l} · ${v}</button>`).join("")}</div>
      <div class="tmax">max. ${max} · ${max === 2 * g.count() ? `alle ${g.count()} Paare` : `nur ${plaques()} Plaketten vorhanden`}</div>
    </div>
    <div class="info"><b>${g.name}</b> · ${n} Paare<br>${layout}</div>
    <button class="newgame" id="new">Spiel starten</button>
    <div class="toast">${msg}</div>`;
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => { MODE = b.dataset.mode; save("mode", MODE); renderMenu(); });
  document.getElementById("new").onclick = () => { newSeed(); save("running", String(SEED)); renderMenu("Paare gemischt – viel Spaß!"); };
  const setTiles = v => { save("tiles2_" + MODE, String(v)); renderMenu(); };
  document.getElementById("minus").onclick = () => setTiles(T - 2);
  document.getElementById("plus").onclick = () => setTiles(T + 2);
  app.querySelectorAll(".chip").forEach(c => c.onclick = () => setTiles(+c.dataset.tiles));
}
// Sicherheitsabfrage ohne Browser-Dialog: zweimal tippen
let endArmed = 0;
function confirmEnd() {
  if (Date.now() - endArmed < 3000) return true;
  endArmed = Date.now();
  const t = document.querySelector(".toast"); if (t) t.textContent = "Nochmal tippen, um das Spiel wirklich zu beenden";
  return false;
}
function newSeed() { SEED = Math.floor(Math.random() * 1e9); save("seed", String(SEED)); }

// ---------- Spielstand (welche Karte war zuerst offen, welche Paare gefunden) ----------
const stateKey = () => `state_${MODE}_${SEED}`;
function getState() { try { return JSON.parse(load(stateKey(), "")) || null; } catch { return null; } }
function blankState() { return { first: null, found: [], last: null }; }
function putState(st) { save(stateKey(), JSON.stringify(st)); }

// Wertet eine gescannte Plakette aus. kind: first | match | miss | found | replay | done
function evaluateTurn(tag, pair, map) {
  const st = getState() || blankState(), total = map.length / 2;
  let kind;
  if (st.found.includes(pair)) kind = "found";
  else if (st.first === null && st.last && st.last.tag === tag) kind = "replay";
  else if (st.first === null || st.first === tag) { st.first = tag; kind = "first"; }
  else {
    const match = map[st.first - 1][0] === pair;
    if (match) st.found.push(pair);
    kind = match ? (st.found.length === total ? "done" : "match") : "miss";
    st.first = null;
  }
  if (kind !== "found" && kind !== "replay") st.last = { tag, kind };
  putState(st);
  return { kind, found: st.found.length, total };
}

// ---------- Soundeffekte (Web Audio, ohne Dateien) ----------
let AC = null;
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === "suspended") AC.resume();
}
function tone(freq, start, dur, type = "sine", vol = .3, endFreq = null) {
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + start;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05);
  return o;
}
function sfxKaching() {           // Registrierkasse: "Ka" + helles "Ching"
  if (!AC) return;
  const len = AC.sampleRate * .06, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const n = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  n.buffer = buf; f.type = "bandpass"; f.frequency.value = 2500; g.gain.value = .6;
  n.connect(f).connect(g).connect(AC.destination); n.start();
  [[2093, .35], [3136, .22], [4186, .15], [5274, .08]].forEach(([fr, v]) => tone(fr, .08, 1.3, "sine", v));
  [[2637, .2], [3951, .12]].forEach(([fr, v]) => tone(fr, .2, 1.1, "sine", v));
}
function sfxLoser() {             // "Wah wah wah waaah"
  if (!AC) return;
  const notes = [[392, 0, .38], [370, .42, .38], [349, .84, .38], [330, 1.26, 1.2]];
  notes.forEach(([fr, st, du], i) => {
    const o = tone(fr, st, du, "sawtooth", .18);
    if (i === 3) {                // Vibrato auf dem letzten Ton
      const l = AC.createOscillator(), lg = AC.createGain();
      l.frequency.value = 6; lg.gain.value = 9; l.connect(lg).connect(o.frequency);
      l.start(AC.currentTime + st); l.stop(AC.currentTime + st + du);
    }
  });
}
function sfxFanfare() {           // alle Paare gefunden
  if (!AC) return;
  sfxKaching();
  [[523, .5], [659, .65], [784, .8], [1047, .95]].forEach(([fr, st]) => tone(fr, st, st === .95 ? 1.2 : .25, "triangle", .3));
}

const TURN_TEXT = {
  first:  t => `Karte 1 von 2 · ${t.found}/${t.total} Paare gefunden`,
  match:  t => `Karte 2 von 2`, miss: t => `Karte 2 von 2`, done: t => `Karte 2 von 2`,
  found:  t => `Dieses Paar ist schon gefunden · ${t.found}/${t.total}`,
  replay: t => `Nochmal angeschaut · ${t.found}/${t.total} Paare gefunden`,
};
let TURN = null, revealed = false;
// Wird aufgerufen, wenn die Karte aufgedeckt bzw. der Song fertig gehoert ist
function reveal() {
  if (revealed || !TURN) return; revealed = true;
  const el = document.getElementById("result"); if (!el) return;
  const k = TURN.kind;
  if (k === "match")      { el.textContent = `Paar gefunden! ${TURN.found}/${TURN.total}`; el.className = "result win show"; sfxKaching(); }
  else if (k === "done")  { el.textContent = "Alle Paare gefunden! 🎉"; el.className = "result win show"; sfxFanfare(); }
  else if (k === "miss")  { el.textContent = "Leider kein Paar"; el.className = "result lose show"; sfxLoser(); }
  else if (k === "first") { el.textContent = "Jetzt die passende Karte suchen"; el.className = "result show"; el.style.fontSize = "16px"; el.style.fontWeight = "600"; }
}
const turnLine = () => TURN ? `<div class="turn">${TURN_TEXT[TURN.kind](TURN)}</div>` : "";
const resultBox = `<div class="result" id="result"></div>`;

// ---------- Plakette ----------
function renderTag(tag) {
  const map = gameMap();
  history.replaceState(null, "", location.pathname);
  if (!tag || tag < 1) {
    app.innerHTML = `${menuLink}<h1>${GAMES[MODE].name}</h1><div id="status"><span class="bad">Unbekannte Plakette – nochmal antippen</span></div>`;
    return;
  }
  if (tag > map.length) {
    app.innerHTML = `${menuLink}<h1>${GAMES[MODE].name}</h1><div id="status">Diese Plakette spielt in diesem Spiel nicht mit.<br>Nur Plaketten 1 bis ${map.length} auslegen.</div>`;
    return;
  }
  const [p, side] = map[tag - 1];
  TURN = evaluateTurn(tag, p, map); revealed = false;
  if (MODE === "musik") renderSong(SONGS[p]);
  else if (MODE === "rechnen") renderMath(PAIRS[p][side]);
  else renderPicture(BILDER[p], side);
}

// Bild-Paar: String -> gleiches Bild zweimal; [Bild, Name] -> Seite 0 Bild, Seite 1 Name
function pictureSide(entry, side) {
  if (typeof entry === "string") return { img: entry };
  if (!Array.isArray(entry)) return side === 0 ? { img: entry.bild } : { song: entry.song };
  return side === 0 ? { img: entry[0] } : { text: entry[1] };
}
function renderPicture(entry, side) {
  const v = pictureSide(entry, side);
  if (v.song) return renderSong(v.song, SNIPPET_BILDER, "Prinzessinnen-Memory");
  const back = v.img
    ? `<svg viewBox="0 0 280 280"><defs><clipPath id="hc"><path d="${HEXP}"/></clipPath></defs>
         <path d="${HEXP}" fill="url(#g)"/>
         <image href="${v.img}" x="27" y="10" width="226" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#hc)"/>
         <path d="${HEXP}" fill="none" stroke="#aec1d6" stroke-width="6"/></svg>`
    : `${HEX_PLAIN}<span class="q ${v.text.length > 7 ? "long" : ""}">${v.text}</span>`;
  app.innerHTML = `${menuLink}
    <h1>Prinzessinnen-Memory</h1>${turnLine()}
    <div class="card" id="card"><div class="flip">
      <div class="face front">${HEX_PAT}<span class="hint">AUFDECKEN</span></div>
      <div class="face back">${back}</div>
    </div></div>
    ${resultBox}<div id="status">Tippen zum Aufdecken</div>`;
  const card = document.getElementById("card"), st = document.getElementById("status");
  if (v.img) { const im = new Image(); im.onerror = () => st.innerHTML = `<span class="bad">Bild „${v.img}“ nicht gefunden</span>`; im.src = v.img; }
  flipHandler(card, st);
}

function renderMath(text) {
  app.innerHTML = `${menuLink}
    <h1>Rechnen-Memory</h1>${turnLine()}
    <div class="card" id="card"><div class="flip">
      <div class="face front">${HEX_PAT}<span class="hint">AUFDECKEN</span></div>
      <div class="face back">${HEX_PLAIN}<span class="q ${text.length > 7 ? "long" : ""}">${text}</span></div>
    </div></div>
    ${resultBox}<div id="status">Tippen zum Aufdecken</div>`;
  flipHandler(document.getElementById("card"), document.getElementById("status"));
}

function flipHandler(card, st) {
  card.onclick = () => {
    unlockAudio();
    card.classList.toggle("open");
    const open = card.classList.contains("open");
    st.textContent = open ? "Tippen zum Verdecken" : "Tippen zum Aufdecken";
    if (open) setTimeout(reveal, 550);   // nach der Dreh-Animation
  };
}

const HEX = "M120 12 L213 66 L213 174 L120 228 L27 174 L27 66 Z", PERIM = 6 * 108;
function renderSong(term, secs = SNIPPET, title = "Musik-Memory") {
  app.innerHTML = `${menuLink}
    <h1>${title}</h1>${turnLine()}
    <button class="hexbtn" id="play" disabled aria-label="Abspielen">
      <svg viewBox="0 0 240 240">
        <path class="track" d="${HEX}" transform="translate(120 120) scale(1.08) translate(-120 -120)"/>
        <path class="prog" id="prog" d="${HEX}" transform="translate(120 120) scale(1.08) translate(-120 -120)" stroke-dasharray="${PERIM}" stroke-dashoffset="${PERIM}"/>
        <path class="shape" d="${HEX}"/>
        <path class="icon" id="icon" d="M100 82 L162 120 L100 158 Z"/>
      </svg>
    </button>
    ${resultBox}<div id="status">Lade …</div>`;
  const btn = document.getElementById("play"), st = document.getElementById("status");
  const prog = document.getElementById("prog"), icon = document.getElementById("icon");
  const audio = new Audio(); audio.preload = "auto";
  let timer = null, started = 0;
  const PLAY = "M100 82 L162 120 L100 158 Z", STOP = "M94 90 H146 V150 H94 Z";

  itunes(term).then(r => { audio.src = r.previewUrl; btn.disabled = false; st.textContent = "Tippen zum Abspielen"; })
    .catch(e => { st.innerHTML = `<span class="bad">${e === "notfound" ? "Song nicht gefunden – Setup prüfen" : "Keine Verbindung zu Apple – Internet prüfen"}</span>`; });

  function stop() {
    const wasPlaying = !audio.paused || started;
    audio.pause(); audio.currentTime = 0; clearInterval(timer); prog.style.strokeDashoffset = PERIM; icon.setAttribute("d", PLAY); st.textContent = "Nochmal? Tippen";
    if (wasPlaying) setTimeout(reveal, 250);   // Ergebnis erst nach dem Hoeren
  }
  btn.onclick = () => {
    unlockAudio();
    if (!audio.paused) return stop();
    audio.currentTime = 0;
    audio.play().then(() => {
      icon.setAttribute("d", STOP); started = Date.now();
      st.innerHTML = `Hör genau hin <span class="eqz"><i></i><i></i><i></i></span>`;
      timer = setInterval(() => { const f = Math.min((Date.now() - started) / 1000 / secs, 1); prog.style.strokeDashoffset = PERIM * (1 - f); if (f >= 1) stop(); }, 200);
    }).catch(() => { st.innerHTML = `<span class="bad">Wiedergabe blockiert – nochmal tippen</span>`; });
  };
  audio.addEventListener("ended", stop);
}

// ---------- Setup / Spielleiter-Ansicht ----------
let DRAFT = null;
const draftJSON = () => `{\n  "aktiv": [${DRAFT.aktiv.map(k => `"${k}"`).join(", ")}],\n  "plaketten": ${DRAFT.plaketten}\n}\n`;
function settingsPanel() {
  const same = SETTINGS_SRC === "datei" && DRAFT.plaketten === plaques()
    && DRAFT.aktiv.join() === Object.keys(GAMES).filter(k => ENABLED.includes(k)).join();
  if (same) return `<p style="margin:-6px 0 26px">✓ Alles gespeichert.</p>`;
  const json = draftJSON();
  const create = GH && `${GH}/new/main?filename=einstellungen.json&value=${encodeURIComponent(json)}`;
  const edit = GH && `${GH}/edit/main/einstellungen.json`;
  return `<div class="row" style="display:block;margin:-6px 0 26px;padding:14px">
    <div class="main" style="margin-bottom:6px">Noch nicht gespeichert</div>
    ${SETTINGS_SRC === "fehlt"
      ? `<p style="margin:0 0 10px">Tippe auf „Datei anlegen“ – GitHub öffnet sich mit dem fertigen Inhalt. Dort nur noch <b>Commit changes</b> tippen.</p>
         ${create ? `<a class="newgame" style="display:inline-block;margin:0;text-decoration:none" href="${create}" target="_blank">Datei anlegen</a>` : ""}`
      : `<p style="margin:0 0 10px">1. „Kopieren“ tippen · 2. „Auf GitHub öffnen“ · 3. dort alles markieren, einfügen und <b>Commit changes</b> tippen.</p>
         <textarea id="json" readonly rows="6" style="width:100%;font:12px ui-monospace,Menlo,monospace;background:var(--bg);color:var(--bronze-hi);border:1px solid rgba(120,144,173,.35);border-radius:8px;padding:8px">${json}</textarea>
         <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
           <button id="copy">Kopieren</button>
           ${edit ? `<a href="${edit}" target="_blank" style="color:var(--bronze-hi);align-self:center">Auf GitHub öffnen ↗</a>` : ""}
         </div>`}
    <p style="margin:10px 0 0;font-size:12px">Danach auf allen Geräten Menü oder Setup neu öffnen.</p>
  </div>`;
}   // im Setup geaenderte, noch nicht gespeicherte Einstellungen
function renderSetup() {
  if (!DRAFT) DRAFT = { aktiv: [...ENABLED], plaketten: plaques() };
  const g = GAMES[MODE], map = gameMap(), n = map.length / 2;
  const tagsOf = i => [0, 1].map(s => map.findIndex(([p, ss]) => p === i && ss === s) + 1);
  app.className = "setup";
  const dupes = MODE === "rechnen" ? PAIRS.map(p => p[1].trim()).filter((r, i, a) => a.indexOf(r) !== i) : [];
  app.innerHTML = `
    <h3>Einstellungen für alle Geräte</h3>
    <p style="margin-bottom:12px">${SETTINGS_SRC === "datei" ? "Geladen aus <code>einstellungen.json</code> – gilt auf jedem Handy."
      : SETTINGS_SRC === "fehlt" ? `<span class="bad">Die Datei <code>einstellungen.json</code> gibt es noch nicht.</span> Schalter einstellen und unten auf „Datei anlegen“ tippen.`
      : `<span class="bad">einstellungen.json konnte nicht geladen werden – es gelten die Standardwerte.</span>`}</p>
    <div class="games">
      ${Object.entries(GAMES).map(([k, v]) => `
        <label><span class="gi">${v.icon}</span>
          <span class="gn">${v.name}<br><span class="gc">${v.count()} Paare</span></span>
          <span class="sw"><input type="checkbox" data-game="${k}" ${DRAFT.aktiv.includes(k) ? "checked" : ""}><span></span></span>
        </label>`).join("")}
    </div>
    <div class="games"><label><span class="gi">⬡</span>
      <span class="gn">Vorhandene Plaketten<br><span class="gc">Obergrenze für „Anzahl Kacheln“</span></span>
      <input id="plq" type="number" min="4" step="2" value="${DRAFT.plaketten}" style="width:76px;font:inherit;font-size:17px;padding:6px 8px;border-radius:8px;border:1px solid rgba(120,144,173,.35);background:var(--bg);color:var(--text);text-align:center">
    </label></div>
    ${settingsPanel()}
    <h3>Zuordnung</h3>
    <h2>${g.name} · diese Runde ${n} von ${g.count()} Paaren = ${2 * n} Kacheln</h2>
    <p>Tags beschriften mit <code>${BASE}?t=1</code> bis <code>?t=${Math.max(SONGS.length, PAIRS.length, BILDER.length) * 2}</code>.
       Unten die Zuordnung der <b>aktuellen</b> Runde auf diesem Handy – nach „Neues Spiel“ ändert sie sich.
       Nicht den Mitspielern zeigen! · <a href="${location.pathname}" style="color:var(--bronze-hi)">Menü</a></p>
    ${dupes.length ? `<p class="bad">Achtung: Ergebnis ${[...new Set(dupes)].join(", ")} kommt mehrfach vor.</p>` : ""}
    <div id="list"></div>`;
  app.querySelectorAll("[data-game]").forEach(cb => cb.onchange = () => {
    const on = [...app.querySelectorAll("[data-game]:checked")].map(c => c.dataset.game);
    if (!on.length) { cb.checked = true; return; }          // mindestens ein Spiel bleibt aktiv
    DRAFT.aktiv = Object.keys(GAMES).filter(k => on.includes(k)); renderSetup();
  });
  document.getElementById("plq").onchange = e => {
    const v = Math.max(4, parseInt(e.target.value, 10) || PLAKETTEN);
    DRAFT.plaketten = v - (v % 2); renderSetup();
  };
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = () => {
    const ta = document.getElementById("json"); ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).catch(() => document.execCommand("copy"))
      .finally(() => { copy.textContent = "Kopiert ✓"; });
  };
  const list = document.getElementById("list"), audio = new Audio();
  const items = MODE === "musik" ? SONGS : MODE === "rechnen" ? PAIRS : BILDER;
  items.forEach((it, i) => {
    if (!map.some(([pp]) => pp === i)) return;                  // spielt diese Runde nicht mit
    const [a, b] = tagsOf(i), row = document.createElement("div"); row.className = "row";
    if (MODE === "bilder" && typeof it === "object" && !Array.isArray(it)) {
      row.innerHTML = `<img src="${it.bild}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:8px;background:#000">
        <div class="txt"><div class="main">${it.bild.split("/").pop()} + ♪</div>
        <div class="meta">Plakette ${a} zeigt das Bild · Plakette ${b} spielt den Song · <span>suche …</span></div></div>`;
      row.querySelector("img").onerror = e => { e.target.replaceWith(Object.assign(document.createElement("div"), { className: "n bad", textContent: "✕" })); row.querySelector(".meta").insertAdjacentHTML("beforeend", ` · <span class="bad">Bild fehlt</span>`); };
      const meta = row.querySelector(".meta span");
      itunes(it.song).then(r => {
        meta.textContent = `gefunden: ${r.artistName} – ${r.trackName}`;
        const btn = document.createElement("button"); btn.textContent = "▶";
        btn.onclick = () => { if (audio.src === r.previewUrl && !audio.paused) return audio.pause(); audio.src = r.previewUrl; audio.play(); };
        row.appendChild(btn);
      }).catch(e => { meta.className = "bad"; meta.textContent = e === "notfound" ? "Song nicht gefunden – Schreibweise ändern" : "keine Verbindung zu Apple"; });
    } else if (MODE === "bilder") {
      const img = typeof it === "string" ? it : it[0];
      const desc = typeof it === "string" ? `Plaketten ${a} + ${b} zeigen beide das Bild` : `Plakette ${a} zeigt das Bild · Plakette ${b} zeigt „${it[1]}“`;
      row.innerHTML = `<img src="${img}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:8px;background:#000">
        <div class="txt"><div class="main">${img.split("/").pop()}</div><div class="meta">${desc}</div></div>`;
      row.querySelector("img").onerror = e => { e.target.replaceWith(Object.assign(document.createElement("div"), { className: "n bad", textContent: "✕" })); row.querySelector(".meta").innerHTML += ` · <span class="bad">Datei fehlt</span>`; };
    } else if (MODE === "rechnen") {
      row.innerHTML = `<div class="n">${i + 1}</div><div class="txt"><div class="main">${it[0]} = ${it[1]}</div>
        <div class="meta">Plakette ${a} zeigt „${it[0]}“ · Plakette ${b} zeigt „${it[1]}“</div></div>`;
    } else {
      row.innerHTML = `<div class="n">${i + 1}</div><div class="txt"><div class="main">${it}</div>
        <div class="meta">Plaketten ${a} + ${b} · <span>suche …</span></div></div>`;
      const meta = row.querySelector(".meta span");
      itunes(it).then(r => {
        meta.textContent = `gefunden: ${r.artistName} – ${r.trackName}`;
        const btn = document.createElement("button"); btn.textContent = "▶";
        btn.onclick = () => { if (audio.src === r.previewUrl && !audio.paused) return audio.pause(); audio.src = r.previewUrl; audio.play(); };
        row.appendChild(btn);
      }).catch(e => { meta.className = "bad"; meta.textContent = e === "notfound" ? "nicht gefunden – Schreibweise ändern" : "keine Verbindung zu Apple"; });
    }
    list.appendChild(row);
  });
}

// ---------- Version anzeigen + automatisch neue Version holen ----------
document.body.insertAdjacentHTML("beforeend", `<div class="ver">Version ${VERSION}</div>`);
function checkUpdate() {
  fetch(location.pathname + "?nocache=" + Date.now(), { cache: "no-store" })
    .then(r => r.text())
    .then(txt => {
      const m = txt.match(/const VERSION = "([^"]+)"/);
      if (!m || m[1] === VERSION) return;
      let tried = ""; try { tried = sessionStorage.getItem("upd") || ""; } catch {}
      if (tried === m[1]) return;                       // nur einmal versuchen, keine Endlosschleife
      try { sessionStorage.setItem("upd", m[1]); } catch {}
      location.replace(location.pathname + "?v=" + m[1] + (params.has("setup") ? "&setup" : ""));
    }).catch(() => {});
}

loadSettings().then(() => {
  if (params.has("setup")) renderSetup();
  else if (params.has("t")) renderTag(parseInt(params.get("t"), 10));
  else renderMenu();
  if (!params.has("t")) checkUpdate();
});
</script>
